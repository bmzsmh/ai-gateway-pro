name = "ai-gateway-pro"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]
usage_model = "standard"

[vars]
# 生产环境变量通过 wrangler secret / dashboard 配置

[[kv_namespaces]]
binding = "KV"
# 请替换 <YOUR_PROD_KV_NAMESPACE_ID> 为你的实际生产 KV namespace ID
# 也可以通过 GitHub Actions vars.KV_NAMESPACE_ID 注入（见 .github/workflows/deploy.yml）
id = "<YOUR_PROD_KV_NAMESPACE_ID>"
